[project]
name = "linguacall-backend"
version = "1.0.0"
description = "AI system-design interviewer — backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
# A pragmatic, strict-but-not-noisy rule set.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",   # function calls in argument defaults (FastAPI Depends() idiom)
    "E501",   # line length handled by black
    "B904",   # allow `raise X` inside except without `from` (HTTPException idiom)
    "RUF001", # typographic dashes/quotes are intentional in prompt & UI copy
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]  # test import gymnastics

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations"
