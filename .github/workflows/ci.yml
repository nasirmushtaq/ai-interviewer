name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: make install

      - name: Lint + format check
        run: make check

      - name: Run tests
        # No LLM key in CI, so the live behavioural tests self-skip; the offline
        # HTTP-smoke and service-layer suites still run.
        run: make test
