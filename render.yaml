# Render.com blueprint — FREE tier: API (Docker) + media SFU (Docker).
#
# Deploy: push this repo, then "New > Blueprint" in Render and point at this file.
# Postgres is hosted free on Neon (https://neon.tech) — paste its pooled
# connection string into DATABASE_URL below. Piston runs on the free public API,
# so nothing to self-host. The frontend deploys separately on Vercel/Cloudflare
# Pages. Set the secret env vars (provider keys, DATABASE_URL, CORS_ORIGINS) in
# the Render dashboard.
#
# NOTE: free web services sleep after ~15 min idle and cold-start (~30–50s) on
# the next request. Move to `plan: starter` for always-on.
services:
  - type: web
    name: linguacall-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      # Neon Postgres pooled connection string (postgresql://...). The app
      # normalises postgres:// and adds the psycopg driver automatically.
      - key: DATABASE_URL
        sync: false
      # Free public Piston — no hosting required.
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston
      # Your deployed frontend origin(s), comma-separated (e.g.
      # https://linguacall.vercel.app). Must NOT be "*" in production.
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MEDIA_SERVICE_TOKEN
        generateValue: true
      # Provider — set ONE of the following sets in the dashboard (secret):
      #   OpenAI:
      - key: OPENAI_API_KEY
        sync: false
      #   or Azure OpenAI:
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        sync: false

  - type: web
    name: linguacall-media
    runtime: docker
    dockerfilePath: ./media/Dockerfile
    dockerContext: ./media
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORE_API_URL
        fromService:
          type: web
          name: linguacall-api
          property: hostport
      - key: MEDIA_SERVICE_TOKEN
        fromService:
          type: web
          name: linguacall-api
          envVarKey: MEDIA_SERVICE_TOKEN
