# nginx serving the built SPA. SPA fallback so client routes work on refresh.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
